services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: schedbot-backend
    volumes:
      - ./backend/src:/app/src
    ports:
      - '8000:8000'
    env_file:
      - ./backend/src/.env
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: schedbot-frontend
    volumes:
      - ./frontend/src:/app/src
    ports:
      - '8443:8443'
    env_file:
      - ./frontend/src/.env
    environment:
      - API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  db:
    image: postgres:17-alpine
    shm_size: 128mb
    volumes:
      - ./pgdata:/var/lib/postgresql/data/
    env_file:
      - ./.env.db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

